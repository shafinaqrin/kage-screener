services:
  screener:
    build:
      context: .
      dockerfile: Dockerfile
    image: kage-screener:local
    container_name: kage-screener
    restart: unless-stopped
    init: true
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # How long a crawl is reused. Long enough that normal browsing causes at
      # most a couple of upstream crawls per hour.
      KAGE_SCREENER_TTL: ${KAGE_SCREENER_TTL:-1800}
      KAGE_SCREENER_TIMEOUT: ${KAGE_SCREENER_TIMEOUT:-45}
    networks:
      - kage-network
    # Published only for debugging; the backend reaches it over kage-network.
    ports:
      - "${SCREENER_PUBLISH_PORT:-19000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=8).status == 200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

networks:
  kage-network:
    external: true
    name: ${KAGE_DOCKER_NETWORK:-kage-network}
